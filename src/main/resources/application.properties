spring.application.name=todo-management
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Store java.util.UUID as CHAR(36) to match Flyway (not BINARY)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Mail (SMTP). Use Mailtrap while learning. ---
# Keep MAIL_ENABLED=false to only log the verification link in the console.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@todo-management.local}
# Link base used in the verification email, e.g. http://localhost:8080/api/auth/verify
app.verification.base-url=${VERIFICATION_BASE_URL:http://localhost:8080/api/auth/verify}

# --- JWT & Cookie Authentication ---
# Access token (short-lived in-memory token, 15 minutes = 900000 ms)
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token (stored in Redis, issued via HttpOnly cookie, 7 days = 604800 seconds)
app.jwt.refresh-expiration-sec=${JWT_REFRESH_EXPIRATION_SEC:604800}
app.auth.cookie.name=refresh_token
app.auth.cookie.path=/api/auth
app.auth.cookie.same-site=Strict
app.auth.cookie.secure=${COOKIE_SECURE:false}

# --- Redis (local dev: Docker; production: Aiven Redis or equivalent). ---
# TODO (production): configure TLS + password via REDIS_PASSWORD / rediss:// URL.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Task attachments: local private storage, workspace per-file default and application cap.
app.attachments.directory=${ATTACHMENT_DIRECTORY:./data/attachments}
app.attachments.default-max-bytes=10485760
app.attachments.max-bytes=26214400
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
